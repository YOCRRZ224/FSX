<svg
    class="fsx-logo"
    viewBox="0 0 500 500"
    xmlns="http://www.w3.org/2000/svg"
    aria-label="FSX Logo"
>
    <defs>

        <!-- Pink → Orange gradient -->
        <linearGradient
            id="fsxGradient"
            x1="0%"
            y1="100%"
            x2="100%"
            y2="0%"
        >
            <stop offset="0%" stop-color="#ff1478"/>
            <stop offset="45%" stop-color="#ff3d32"/>
            <stop offset="100%" stop-color="#ffae18"/>
        </linearGradient>

        <!-- Soft glow -->
        <filter
            id="fsxGlow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%"
        >
            <feGaussianBlur
                stdDeviation="18"
                result="blur"
            />

            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

    </defs>


    <!-- ================================= -->
    <!-- GLOW -->
    <!-- ================================= -->

    <path
        class="fsx-glow"
        fill="url(#fsxGradient)"
        opacity="0.45"
        filter="url(#fsxGlow)"
        d="
            M 250 70

            C 330 55 410 85 425 155

            C 490 190 470 270 430 300

            C 450 370 390 430 320 415

            C 250 470 185 440 155 405

            C 75 430 45 355 75 295

            C 25 225 75 155 135 150

            C 150 80 210 55 250 70

            Z
        "
    />


    <!-- ================================= -->
    <!-- MAIN ORGANIC BLOB -->
    <!-- ================================= -->

    <path
        id="fsxBlob"
        fill="url(#fsxGradient)"
        d="
            M 250 70

            C 330 55 410 85 425 155

            C 490 190 470 270 430 300

            C 450 370 390 430 320 415

            C 250 470 185 440 155 405

            C 75 430 45 355 75 295

            C 25 225 75 155 135 150

            C 150 80 210 55 250 70

            Z
        "
    >

        <!-- Continuous blob morph -->
        <animate
            attributeName="d"
            dur="7s"
            repeatCount="indefinite"
            values="

            M 250 70
            C 330 55 410 85 425 155
            C 490 190 470 270 430 300
            C 450 370 390 430 320 415
            C 250 470 185 440 155 405
            C 75 430 45 355 75 295
            C 25 225 75 155 135 150
            C 150 80 210 55 250 70 Z;


            M 250 55
            C 320 70 400 55 440 135
            C 475 195 455 250 420 300
            C 445 370 370 450 300 420
            C 235 465 165 425 140 390
            C 70 420 40 340 80 285
            C 30 215 85 150 145 145
            C 160 75 215 45 250 55 Z;


            M 250 75
            C 340 40 420 100 410 165
            C 480 210 455 275 425 315
            C 440 380 365 425 310 405
            C 240 465 180 445 145 400
            C 65 420 50 350 85 290
            C 20 230 70 145 140 155
            C 155 90 205 65 250 75 Z;


            M 250 70
            C 330 55 410 85 425 155
            C 490 190 470 270 430 300
            C 450 370 390 430 320 415
            C 250 470 185 440 155 405
            C 75 430 45 355 75 295
            C 25 225 75 155 135 150
            C 150 80 210 55 250 70 Z

            "
        />

    </path>


    <!-- ================================= -->
    <!-- FSX MONOGRAM -->
    <!-- ================================= -->

   <!-- ================================= -->
<!-- FSX MONOGRAM -->
<!-- ================================= -->

<g
    class="fsx-monogram"
    fill="white"
>

    <!-- ============================= -->
    <!-- F -->
    <!-- ============================= -->

    <path d="
        M 125 180
        L 220 180
        L 195 210
        L 160 210
        L 160 235
        L 195 235
        L 175 265
        L 160 265
        L 160 320
        L 125 355
        Z
    "/>


    <!-- ============================= -->
    <!-- S -->
    <!-- ============================= -->

    <path d="
        M 235 180
        L 325 180
        L 300 210
        L 255 210

        L 245 220
        L 250 230
        L 305 250

        L 325 270
        L 320 295

        L 285 330
        L 220 330
        L 245 300
        L 275 300

        L 290 285
        L 285 275
        L 230 255

        L 210 235
        L 215 210
        Z
    "/>


    <!-- ============================= -->
    <!-- X -->
    <!-- ============================= -->

    <path d="
        M 345 180
        L 380 180
        L 345 245
        L 390 330

        L 350 330
        L 325 275

        L 295 330
        L 255 330

        L 305 245
        L 275 180

        L 315 180
        L 330 220

        Z
    "/>

</g>


    <!-- ================================= -->
    <!-- SUBTLE FLOATING ANIMATION -->
    <!-- ================================= -->

    <g>

        <circle
            cx="100"
            cy="150"
            r="7"
            fill="#ffae18"
            opacity="0.8"
        >
            <animate
                attributeName="cy"
                values="150;140;150"
                dur="3s"
                repeatCount="indefinite"
            />
        </circle>

        <circle
            cx="410"
            cy="350"
            r="5"
            fill="#ff3d32"
            opacity="0.8"
        >
            <animate
                attributeName="cy"
                values="350;360;350"
                dur="4s"
                repeatCount="indefinite"
            />
        </circle>

        <circle
            cx="400"
            cy="120"
            r="4"
            fill="#ffae18"
            opacity="0.7"
        >
            <animate
                attributeName="cy"
                values="120;110;120"
                dur="2.5s"
                repeatCount="indefinite"
            />
        </circle>

    </g>

</svg>