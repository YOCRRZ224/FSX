<!DOCTYPE html>
<html>
<head>
    <title>FSX</title>
<script src="static/gsap.js"></script>


<script src="static/fuse.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="static/logo.png">
    <link rel="stylesheet" href="static/style.css" type="text/css" media="all" />

</head>
<body>

<div class="header">
    <span><img id="logo"/></span>
    <button onclick="toggleShuffle()" id="headerShuffle"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#FFFFFF" viewBox="0 0 256 256"><path d="M237.66,178.34a8,8,0,0,1,0,11.32l-24,24a8,8,0,0,1-11.32-11.32L212.69,192H200.94a72.12,72.12,0,0,1-58.59-30.15l-41.72-58.4A56.1,56.1,0,0,0,55.06,80H32a8,8,0,0,1,0-16H55.06a72.12,72.12,0,0,1,58.59,30.15l41.72,58.4A56.1,56.1,0,0,0,200.94,176h11.75l-10.35-10.34a8,8,0,0,1,11.32-11.32ZM143,107a8,8,0,0,0,11.16-1.86l1.2-1.67A56.1,56.1,0,0,1,200.94,80h11.75L202.34,90.34a8,8,0,0,0,11.32,11.32l24-24a8,8,0,0,0,0-11.32l-24-24a8,8,0,0,0-11.32,11.32L212.69,64H200.94a72.12,72.12,0,0,0-58.59,30.15l-1.2,1.67A8,8,0,0,0,143,107Zm-30,42a8,8,0,0,0-11.16,1.86l-1.2,1.67A56.1,56.1,0,0,1,55.06,176H32a8,8,0,0,0,0,16H55.06a72.12,72.12,0,0,0,58.59-30.15l1.2-1.67A8,8,0,0,0,113,149Z"></path></svg></button>

    
</div>

<div id="home" class="tab active"></div>

<div id="songs" class="tab fsx-library">

    <header class="library-header">

        <div class="library-title">
            <h1>Library</h1>
          
        </div>

        <div class="library-controls">

            <button
                onclick="toggleUploadModal(true)"
                class="library-icon"
                aria-label="Add music"
            >
                <svg viewBox="0 0 256 256">
                    <path d="M224 128a8 8 0 0 1-8 8h-80v80a8 8 0 0 1-16 0v-80H40a8 8 0 0 1 0-16h80V40a8 8 0 0 1 16 0v80h80a8 8 0 0 1 8 8z"/>
                </svg>
            </button>

            <button
                onclick="toggleSpotifyModal(true)"
                class="library-icon"
                aria-label="Spotify"
            >
                <svg viewBox="0 0 256 256">
                    <path d="M128 24a104 104 0 1 0 104 104A104.12 104.12 0 0 0 128 24Zm47 145.7a8 8 0 0 1-10.8 3.3 77 77 0 0 0-72.4 0 8 8 0 1 1-7.6-14.1 93 93 0 0 1 87.6 0 8 8 0 0 1 3.2 10.8Zm16-28a8 8 0 0 1-10.8 3.3 110.6 110.6 0 0 0-104.4 0 8 8 0 1 1-7.6-14.1 126.6 126.6 0 0 1 119.6 0 8 8 0 0 1 3.2 10.8Zm0-28a8 8 0 0 1-10.8 3.3 110.6 110.6 0 0 0-104.4 0 8 8 0 1 1-7.6-14.1 126.6 126.6 0 0 1 119.6 0 8 8 0 0 1 3.2 10.8Z"/>
                </svg>
            </button>

        </div>

    </header>


    <nav class="library-tabs">

        <button
            class="library-tab active"
            onclick="renderSongs(songs)"
        >
            All
        </button>

    </nav>





    <div id="songList"></div>

</div>

<div id="search" class="tab">
    <div style="padding: 10px 0 20px 0;">
        <h2 style="margin: 0 0 20px 0; font-size: 32px; font-weight: 900;">Search</h2>
        <input type="text" id="searchInput" placeholder="Search songs or artists..." autocomplete="off">
    </div>
    <div id="searchResults"></div>
</div>

<div id="uploadModal" style="display: none; position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); align-items: center; justify-content: center;">
    <div class="card glass-card" style="width: 90%; max-width: 350px; border: 1px solid #222; text-align: center; padding: 20px;">
        <h3 style="margin-top: 0;">Upload Track</h3>
        <input type="file" id="fileInput" accept=".mp3" style="display: none;" onchange="updateFileLabel()">
        <label for="fileInput" id="fileLabel" style="display: block; padding: 20px; border: 2px dashed #333; border-radius: 12px; cursor: pointer; margin-bottom: 15px;">
            Click to select MP3
        </label>
        <div id="uploadProgress" style="width: 0%; height: 4px; background: #1db954; border-radius: 2px; margin-bottom: 15px; transition: width 0.3s;"></div>
        <div style="display: flex; gap: 10px;">
            <button onclick="toggleUploadModal(false)" style="flex: 1; padding: 10px; opacity: 0.5;">Cancel</button>
            <button onclick="startUpload()" id="uploadBtn" style="flex: 1; padding: 10px; background: #1db954 !important; color: black; border-radius: 8px; font-weight: bold;">Upload</button>
        </div>
    </div>
</div>

<div class="player-container">
    <div class="player">
        <div class="mini-progress-container"><div id="miniProgress" class="mini-progress-bar"></div></div>
        <div class="mini-info" onclick="openPlayer()">
            <img id="miniCover" class="cover" src="" alt="">
            <div class="text-meta">
                <span id="now">Nothing playing</span>
                <span id="miniArtist" class="mini-artist">Select a track</span>
            </div>
        </div>
        <div class="mini-controls">
            <button onclick="prevSong(event)"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#ffffff" viewBox="0 0 256 256"><path d="M199.81,34a16,16,0,0,0-16.24.43L64,109.23V40a8,8,0,0,0-16,0V216a8,8,0,0,0,16,0V146.77l119.57,74.78A15.95,15.95,0,0,0,208,208.12V47.88A15.86,15.86,0,0,0,199.81,34ZM192,208,64.16,128,192,48.07Z"></path></svg></button>
            <button onclick="togglePlay(event)" id="miniPlayBtn"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#ffffff" viewBox="0 0 256 256"><path d="M232.4,114.49,88.32,26.35a16,16,0,0,0-16.2-.3A15.86,15.86,0,0,0,64,39.87V216.13A15.94,15.94,0,0,0,80,232a16.07,16.07,0,0,0,8.36-2.35L232.4,141.51a15.81,15.81,0,0,0,0-27ZM80,215.94V40l143.83,88Z"></path></svg></button>
            <button onclick="nextSong(event)"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#ffffff" viewBox="0 0 256 256"><path d="M200,32a8,8,0,0,0-8,8v69.23L72.43,34.45A15.95,15.95,0,0,0,48,47.88V208.12a16,16,0,0,0,24.43,13.43L192,146.77V216a8,8,0,0,0,16,0V40A8,8,0,0,0,200,32ZM64,207.93V48.05l127.84,80Z"></path></svg></button>
        </div>
    </div>
</div>

<div id="fullPlayer" class="fullPlayer">
    <div class="fp-bg" id="bg"></div>
    <div class="fp-bg2" id="bg2"></div>
    <div class="fp-overlay"></div>
    
    <div class="fp-content">
        <div class="fp-artwork-area audio-border-panel">
            <img id="cover" crossorigin="anonymous" src="">
        </div>

        <div class="fp-right-pane">
            <div class="fp-meta-area">
                <div class="fp-title" id="fpTitle">Song Name</div>
                <div class="fp-artist" id="fpArtist">Artist</div>
            </div>

            <div class="fp-progress-area">
                <div class="progress-wrap">
                    <input type="range" id="fpProgress" value="0">
                </div>
                <div class="time-stamps">
                    <span id="timeCurrent">0:00</span>
                    <span id="timeTotal">0:00</span>
                </div>
            </div>

            <div class="fp-controls-area">
                <button class="side-btn" id="fpShuffleBtn" onclick="toggleShuffle()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#FFFFFF" viewBox="0 0 256 256"><path d="M237.66,178.34a8,8,0,0,1,0,11.32l-24,24a8,8,0,0,1-11.32-11.32L212.69,192H200.94a72.12,72.12,0,0,1-58.59-30.15l-41.72-58.4A56.1,56.1,0,0,0,55.06,80H32a8,8,0,0,1,0-16H55.06a72.12,72.12,0,0,1,58.59,30.15l41.72,58.4A56.1,56.1,0,0,0,200.94,176h11.75l-10.35-10.34a8,8,0,0,1,11.32-11.32ZM143,107a8,8,0,0,0,11.16-1.86l1.2-1.67A56.1,56.1,0,0,1,200.94,80h11.75L202.34,90.34a8,8,0,0,0,11.32,11.32l24-24a8,8,0,0,0,0-11.32l-24-24a8,8,0,0,0-11.32,11.32L212.69,64H200.94a72.12,72.12,0,0,0-58.59,30.15l-1.2,1.67A8,8,0,0,0,143,107Zm-30,42a8,8,0,0,0-11.16,1.86l-1.2,1.67A56.1,56.1,0,0,1,55.06,176H32a8,8,0,0,0,0,16H55.06a72.12,72.12,0,0,0,58.59-30.15l1.2-1.67A8,8,0,0,0,113,149Z"></path></svg>
                </button>
                <div class="main-ctrls">
                    <button onclick="prevSong()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#FFFFFF" viewBox="0 0 256 256"><path d="M199.81,34a16,16,0,0,0-16.24.43L64,109.23V40a8,8,0,0,0-16,0V216a8,8,0,0,0,16,0V146.77l119.57,74.78A15.95,15.95,0,0,0,208,208.12V47.88A15.86,15.86,0,0,0,199.81,34ZM192,208,64.16,128,192,48.07Z"></path></svg>
                    </button>
                    <button onclick="togglePlay()" id="fpPlayBtn" class="play-main">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#000000" viewBox="0 0 256 256"><path d="M232.4,114.49,88.32,26.35a16,16,0,0,0-16.2-.3A15.86,15.86,0,0,0,64,39.87V216.13A15.94,15.94,0,0,0,80,232a16.07,16.07,0,0,0,8.36-2.35L232.4,141.51a15.81,15.81,0,0,0,0-27ZM80,215.94V40l143.83,88Z"></path></svg>
                    </button>
                    <button onclick="nextSong()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#ffffff" viewBox="0 0 256 256"><path d="M200,32a8,8,0,0,0-8,8v69.23L72.43,34.45A15.95,15.95,0,0,0,48,47.88V208.12a16,16,0,0,0,24.43,13.43L192,146.77V216a8,8,0,0,0,16,0V40A8,8,0,0,0,200,32ZM64,207.93V48.05l127.84,80Z"></path></svg>
                    </button>
                </div>
                <button class="side-btn" id="fpRepeatBtn" onclick="toggleRepeat()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#ffffff" viewBox="0 0 256 256"><path d="M24,128A72.08,72.08,0,0,1,96,56H204.69L194.34,45.66a8,8,0,0,1,11.32-11.32l24,24a8,8,0,0,1,0,11.32l-24,24a8,8,0,0,1-11.32-11.32L204.69,72H96a56.06,56.06,0,0,0-56,56,8,8,0,0,1-16,0Zm200-8a8,8,0,0,0-8,8,56.06,56.06,0,0,1-56,56H51.31l10.35-10.34a8,8,0,0,0-11.32-11.32l-24,24a8,8,0,0,0,0,11.32l24,24a8,8,0,0,0,11.32-11.32L51.31,200H160a72.08,72.08,0,0,0,72-72A8,8,0,0,0,224,120Z"></path></svg>
                </button>
                <button
    class="side-btn"
    id="fpLyricsBtn"
    onclick="
        console.log('LYRICS BUTTON CLICKED');
        console.log('openLyrics =', typeof window.openLyrics);
        console.log('currentSong =', typeof window.currentSong);
        try {
            openLyrics();
        } catch (e) {
            console.error('OPEN LYRICS CALL FAILED:', e);
        }
    "
    aria-label="Lyrics"
>
    <svg xmlns="http://www.w3.org/2000/svg"
         width="20"
         height="20"
         fill="none"
         viewBox="0 0 256 256">
        <path
            d="M40 48h176M40 104h176M40 160h112"
            stroke="currentColor"
            stroke-width="16"
            stroke-linecap="round"/>
    </svg>
</button>
            </div>

            <button class="closeBtn top" onclick="closePlayer()">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#FFFFFF" viewBox="0 0 256 256"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path></svg>
            </button>
        </div>
    </div>

</div>

<div class="nav">
    <div class="nav-btn active" id="nav-home" onclick="switchTab('home')">
        <span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#FFFFFF" viewBox="0 0 256 256"><path d="M240,208H224V136l2.34,2.34A8,8,0,0,0,237.66,127L139.31,28.68a16,16,0,0,0-22.62,0L18.34,127a8,8,0,0,0,11.32,11.31L32,136v72H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM48,120l80-80,80,80v88H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48Zm96,88H112V160h32Z"></path></svg></span><span>Home</span>
    </div>
    <div class="nav-btn" id="nav-songs" onclick="switchTab('songs')">
        <span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#FFFFFF" viewBox="0 0 256 256"><path d="M231.65,194.55,198.46,36.75a16,16,0,0,0-19-12.39L132.65,34.42a16.08,16.08,0,0,0-12.3,19l33.19,157.8A16,16,0,0,0,169.16,224a16.25,16.25,0,0,0,3.38-.36l46.81-10.06A16.09,16.09,0,0,0,231.65,194.55ZM136,50.15c0-.06,0-.09,0-.09l46.8-10,3.33,15.87L139.33,66Zm6.62,31.47,46.82-10.05,3.34,15.9L146,97.53Zm6.64,31.57,46.82-10.06,13.3,63.24-46.82,10.06ZM216,197.94l-46.8,10-3.33-15.87L212.67,182,216,197.85C216,197.91,216,197.94,216,197.94ZM104,32H56A16,16,0,0,0,40,48V208a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V48A16,16,0,0,0,104,32ZM56,48h48V64H56Zm0,32h48v96H56Zm48,128H56V192h48v16Z"></path></svg></span><span>Library</span>
    </div>
    <div class="nav-btn" id="nav-search" onclick="switchTab('search')">
        <span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#FFFFFF" viewBox="0 0 256 256"><path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"></path></svg></span><span>Search</span>
    </div>
</div>
<div id="spotifyModal" style="
    display: none;
    position: fixed;
    inset: 0;
    z-index: 999;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    align-items: center;
    justify-content: center;
">
    <div class="card terminal-card" style="
        width: 92%;
        max-width: 400px;
        padding: 20px;
        background: #0a0a0a;
        border: 2px solid #222;
        box-shadow: 0 16px 0px rgba(0, 0, 0, 1);
        font-family: 'Source Code Pro', monospace, sans-serif;
        color: #fff;
        animation: brutalPop 0.15s cubic-bezier(0.1, 0.9, 0.2, 1);
    ">
        <div style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #222;
            padding-bottom: 10px;
            margin-bottom: 16px;
        ">
            <h3 style="
                margin: 0;
                font-size: 13px;
                font-weight: 900;
                text-transform: uppercase;
                letter-spacing: 1.5px;
                color: #a0a0a0;
            ">
                Download Song
            </h3>
            <span style="font-size: 10px; color: #555;">yocrrz</span>
        </div>

        <div style="position: relative; margin-bottom: 12px;">
            <input id="spotifyUrl" type="text" placeholder="write song name or link" style="
                width: 100%;
                padding: 12px;
                background: #000;
                border: 1px solid #333;
                color: #1db954;
                font-family: monospace;
                font-size: 12px;
                outline: none;
                transition: border-color 0.2s ease, background 0.2s ease;
            " onfocus="this.style.borderColor='#1db954'; this.style.background='#030a05';" onblur="this.style.borderColor='#333'; this.style.background='#000';" />
        </div>

        <div id="spotifyStatusBox" style="
    margin-bottom: 16px;
    padding: 10px;
    background: #111;
    border-left: 3px solid #555;
    font-size: 11px;
    color: #888;
    letter-spacing: 0.5px;
    font-family: monospace;
    text-transform: uppercase;
">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
        <div>
            <span style="color: #555;">Status:</span>
            <span id="spotifyStatus" style="color: #fff;">Ready go ahead</span>
        </div>
        <span id="terminalCursor" class="terminal-cursor" style="display: none;">_</span>
    </div>
    
    <div id="spotifyLoader" style="
        display: none; 
        font-family: monospace; 
        color: #1db954; 
        letter-spacing: 1px;
        margin-top: 6px;
        border-top: 1px dashed #222;
        padding-top: 6px;
    ">
        [□□□□□□□□□□] 0%
    </div>
</div>


        <div style="display: flex; gap: 10px;">
            <button onclick="toggleSpotifyModal(false)" style="
                flex: 1;
                padding: 12px;
                background: transparent;
                border: 1px solid #333;
                color: #888;
                font-family: monospace;
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
                cursor: pointer;
                transition: all 0.15s ease;
            " onmouseover="this.style.background='#161616'; this.style.color='#fff';" onmouseout="this.style.background='transparent'; this.style.color='#888';">
                Back
            </button>

            <button onclick="downloadSpotify()" id="spotifyDownloadBtn" style="
                flex: 1;
                padding: 12px;
                background: #fff;
                border: 1px solid #fff;
                color: #FFFFFF;
                font-family: monospace;
                font-size: 11px;
                font-weight: 900;
                text-transform: uppercase;
                cursor: pointer;
                transition: all 0.15s ease;
            " onmouseover="this.style.background='#1db954'; this.style.borderColor='#1db954';" onmouseout="this.style.background='#fff'; this.style.borderColor='#fff';">
                Download
            </button>
        </div>
    </div>
</div>


<div id="deleteModal">

    <div class="delete-card">

        <h3>Delete Song</h3>

        <p id="deleteSongName"></p>

        <div class="delete-actions">

            <button onclick="closeDeleteModal()">
                Cancel
            </button>
<button onclick="confirmDelete()">
    Delete <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#FF6A5E" viewBox="0 0 256 256"><path d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm96,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"></path></svg>
</button>

        </div>

    </div>

</div>
<div id="lyricsOverlay" class="lyrics-overlay">

    <div id="lyricsBg" class="lyrics-bg"></div>

    <div class="lyrics-drawer">

        <header class="lyrics-header">

            <div class="lyrics-heading">
                <span>LYRICS</span>
                <small id="lyricsStatus">SYNCED</small>
            </div>

            <div class="lyrics-header-actions">

                <!-- Expand -->
                <button
                    id="lyricsExpand"
                    class="lyrics-icon-btn"
                    onclick="expandLyrics()"
                    aria-label="Fullscreen lyrics"
                >
                    <svg xmlns="http://www.w3.org/2000/svg"
                         width="20"
                         height="20"
                         fill="none"
                         viewBox="0 0 256 256">
                        <path
                            d="M40 96V56a16 16 0 0 1 16-16h40M216 96V56a16 16 0 0 0-16-16h-40M40 160v40a16 16 0 0 0 16 16h40M216 160v40a16 16 0 0 1-16 16h-40"
                            stroke="currentColor"
                            stroke-width="16"
                            stroke-linecap="round"
                            stroke-linejoin="round"/>
                    </svg>
                </button>

                <!-- Close -->
                <button
                    id="lyricsClose"
                    class="lyrics-icon-btn"
                    onclick="toggleLyrics()"
                    aria-label="Close lyrics"
                >
                    <svg xmlns="http://www.w3.org/2000/svg"
                         width="20"
                         height="20"
                         fill="none"
                         viewBox="0 0 256 256">
                        <path
                            d="M200 56 56 200M56 56l144 144"
                            stroke="currentColor"
                            stroke-width="16"
                            stroke-linecap="round"/>
                    </svg>
                </button>

            </div>

        </header>

        <div class="lyrics-song-info">
            <h2 id="lyricsTitle">Unknown Track</h2>
            <p id="lyricsArtist">Unknown Artist</p>
        </div>

        <main id="lyricsViewport" class="lyrics-viewport">
            <div id="lyricsContainer" class="lyrics-container"></div>
        </main>

        <div class="lyrics-bottom">

            <div class="lyrics-progress">
                <span id="lyricsCurrentTime">0:00</span>

                <div class="lyrics-progress-track">
                    <div id="lyricsProgressFill"></div>
                </div>

                <span id="lyricsDuration">0:00</span>
            </div>

            <button
                id="lyricsPlayBtn"
                class="lyrics-play-btn"
                onclick="togglePlay()"
                aria-label="Play / Pause"
            >
                <svg id="lyricsPlayIcon"
                     xmlns="http://www.w3.org/2000/svg"
                     width="22"
                     height="22"
                     fill="currentColor"
                     viewBox="0 0 256 256">
                    <path d="M228.04 103.95 84.15 19.96A16 16 0 0 0 60 33.76v188.48a16 16 0 0 0 24.15 13.8l143.89-84a28 28 0 0 0 0-48.09Z"/>
                </svg>
            </button>

        </div>

    </div>
</div>
<audio id="audio" crossorigin="anonymous" preload="auto"></audio>
